<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · B端后台管理系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===================== 基础重置 ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ===================== 主题变量 ===================== */
:root,
[data-theme="light-blue"] {
  --bg: #f0f7ff;
  --bg-gradient: linear-gradient(135deg, #e8f1ff 0%, #f0f7ff 50%, #dbeafe 100%);
  --surface: #ffffff;
  --border: #d6e4ff;
  --border-light: #e8f1ff;
  --text: #1a2744;
  --text-secondary: #5a6a85;
  --text-dim: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-light: #dbeafe;
  --primary-lighter: #eff6ff;
  --accent: #06b6d4;
  --accent-light: #cffafe;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --shadow-sm: 0 1px 3px rgba(59,130,246,0.08);
  --shadow-md: 0 4px 12px rgba(59,130,246,0.08);
  --shadow-lg: 0 12px 40px rgba(59,130,246,0.12);
  --shadow-xl: 0 24px 64px rgba(59,130,246,0.15);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --font-sans: 'Manrope', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --logo-grad: linear-gradient(135deg, #3b82f6, #06b6d4);
  --brand-side-bg: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
  --brand-side-text: #ffffff;
  --grid-color: transparent;
  --input-bg: #f8fbff;
  --glow: none;
}

[data-theme="white"] {
  --bg: #ffffff;
  --bg-gradient: linear-gradient(135deg, #ffffff 0%, #fafafa 50%, #f5f3ff 100%);
  --surface: #ffffff;
  --border: #e8e8e8;
  --border-light: #f0f0f0;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-dim: #9ca3af;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #e0e7ff;
  --primary-lighter: #f5f3ff;
  --accent: #7c3aed;
  --accent-light: #ede9fe;
  --success: #059669;
  --warning: #d97706;
  --danger: #dc2626;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.1);
  --logo-grad: linear-gradient(135deg, #4f46e5, #7c3aed);
  --brand-side-bg: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  --brand-side-text: #ffffff;
  --grid-color: transparent;
  --input-bg: #fafafa;
  --glow: none;
}

[data-theme="scifi"] {
  --bg: #0a0e27;
  --bg-gradient: linear-gradient(135deg, #0a0e27 0%, #0d1b3e 50%, #0a1530 100%);
  --surface: rgba(13,27,62,0.6);
  --border: rgba(0,212,255,0.15);
  --border-light: rgba(0,212,255,0.06);
  --text: #e0f2fe;
  --text-secondary: #7dd3fc;
  --text-dim: #4a6a8a;
  --primary: #00d4ff;
  --primary-hover: #00b4d4;
  --primary-light: rgba(0,212,255,0.1);
  --primary-lighter: rgba(0,212,255,0.05);
  --accent: #22d3ee;
  --accent-light: rgba(34,211,238,0.1);
  --success: #00ff88;
  --warning: #ffaa00;
  --danger: #ff3366;
  --shadow-sm: 0 0 12px rgba(0,212,255,0.05);
  --shadow-md: 0 0 20px rgba(0,212,255,0.08);
  --shadow-lg: 0 0 40px rgba(0,212,255,0.12);
  --shadow-xl: 0 0 64px rgba(0,212,255,0.15);
  --logo-grad: linear-gradient(135deg, #00d4ff, #0066ff);
  --brand-side-bg: linear-gradient(135deg, #0a0e27 0%, #0d1b3e 100%);
  --brand-side-text: #e0f2fe;
  --grid-color: rgba(0,212,255,0.03);
  --input-bg: rgba(0,212,255,0.03);
  --glow: 0 0 20px rgba(0,212,255,0.3);
}

/* ===================== 全局 ===================== */
body {
  font-family: var(--font-sans);
  background: var(--bg-gradient);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  -webkit-font-smoothing: antialiased;
  transition: background .4s, color .3s;
  overflow: hidden;
}

/* 背景网格 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* 背景装饰光斑 */
body::after {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 600px 400px at 20% 30%, var(--primary-lighter), transparent 60%),
    radial-gradient(ellipse 500px 400px at 80% 70%, var(--accent-light), transparent 60%);
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
}

/* ===================== 品牌侧 ===================== */
.brand-side {
  width: 50%;
  background: var(--brand-side-bg);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 48px;
  position: relative;
  overflow: hidden;
  z-index: 1;
}

/* 品牌侧装饰 */
.brand-side::before {
  content: '';
  position: absolute;
  top: -200px; right: -200px;
  width: 500px; height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%);
  pointer-events: none;
}
.brand-side::after {
  content: '';
  position: absolute;
  bottom: -150px; left: -150px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
  pointer-events: none;
}

/* 科幻蓝品牌侧网格 */
[data-theme="scifi"] .brand-side::before {
  top: -100px; right: -100px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(0,212,255,0.15), transparent 70%);
}
[data-theme="scifi"] .brand-side::after {
  bottom: -100px; left: -100px;
  background: radial-gradient(circle, rgba(0,102,255,0.1), transparent 70%);
}

/* 品牌侧网格背景 */
.brand-side-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
[data-theme="scifi"] .brand-side-grid {
  background-image:
    linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
}

.brand-header {
  display: flex;
  align-items: center;
  gap: 14px;
  position: relative;
  z-index: 2;
}
.brand-logo {
  width: 44px; height: 44px;
  border-radius: var(--radius-md);
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 20px; color: var(--brand-side-text);
  flex-shrink: 0;
}
[data-theme="scifi"] .brand-logo {
  background: rgba(0,212,255,0.1);
  border-color: rgba(0,212,255,0.3);
  box-shadow: 0 0 20px rgba(0,212,255,0.2);
}
.brand-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--brand-side-text);
  letter-spacing: -0.3px;
}

.brand-content {
  position: relative;
  z-index: 2;
  max-width: 440px;
}
.brand-content h1 {
  font-size: 42px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -1.5px;
  color: var(--brand-side-text);
  margin-bottom: 20px;
}
.brand-content p {
  font-size: 16px;
  line-height: 1.7;
  color: rgba(255,255,255,0.7);
  margin-bottom: 40px;
}
[data-theme="scifi"] .brand-content p {
  color: rgba(224,242,254,0.5);
}

.brand-features {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.brand-feature {
  display: flex;
  align-items: center;
  gap: 12px;
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  font-weight: 500;
}
[data-theme="scifi"] .brand-feature {
  color: rgba(224,242,254,0.6);
}
.brand-feature-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
[data-theme="scifi"] .brand-feature-icon {
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.15);
}

.brand-footer {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: rgba(255,255,255,0.4);
  font-size: 13px;
}
[data-theme="scifi"] .brand-footer {
  color: rgba(224,242,254,0.3);
}
.brand-footer a {
  color: rgba(255,255,255,0.6);
  transition: color .2s;
}
[data-theme="scifi"] .brand-footer a {
  color: rgba(224,242,254,0.5);
}
.brand-footer a:hover { color: var(--brand-side-text); }

/* 品牌侧统计 */
.brand-stats {
  display: flex;
  gap: 32px;
  margin-top: 40px;
  position: relative;
  z-index: 2;
}
.brand-stat {
  display: flex;
  flex-direction: column;
}
.brand-stat-num {
  font-size: 28px;
  font-weight: 800;
  color: var(--brand-side-text);
  font-family: var(--font-mono);
  letter-spacing: -1px;
}
.brand-stat-label {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}
[data-theme="scifi"] .brand-stat-label {
  color: rgba(224,242,254,0.3);
}

/* ===================== 表单侧 ===================== */
.form-side {
  width: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px;
  position: relative;
  z-index: 1;
}

.form-container {
  width: 100%;
  max-width: 400px;
}

/* 主题切换器 */
.theme-switcher {
  display: flex;
  gap: 6px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 40px;
  width: fit-content;
}
[data-theme="scifi"] .theme-switcher {
  backdrop-filter: blur(12px);
}
.theme-switch-btn {
  padding: 6px 16px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  font-family: var(--font-sans);
  white-space: nowrap;
}
.theme-switch-btn:hover { color: var(--text); }
.theme-switch-btn.active {
  background: var(--primary);
  color: white;
}
[data-theme="scifi"] .theme-switch-btn.active {
  box-shadow: 0 0 8px rgba(0,212,255,0.3);
}

/* 表单标题 */
.form-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.8px;
  margin-bottom: 8px;
}
.form-subtitle {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 36px;
}

/* 输入框组 */
.input-group {
  margin-bottom: 20px;
}
.input-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.input-wrapper {
  position: relative;
}
.input-wrapper svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  z-index: 1;
}
.input-field {
  width: 100%;
  height: 48px;
  padding: 0 14px 0 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-sans);
  outline: none;
  transition: all .2s;
}
.input-field:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light);
}
[data-theme="scifi"] .input-field:focus {
  box-shadow: 0 0 0 3px rgba(0,212,255,0.1), 0 0 16px rgba(0,212,255,0.1);
}
.input-field::placeholder { color: var(--text-dim); }

/* 密码可见切换 */
.password-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  cursor: pointer;
  transition: color .2s;
  background: none;
  border: none;
  padding: 4px;
}
.password-toggle:hover { color: var(--primary); }

/* 记住我 & 忘记密码 */
.form-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.checkbox-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
}
.custom-checkbox {
  width: 18px; height: 18px;
  border-radius: 4px;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
  background: var(--input-bg);
}
.custom-checkbox.checked {
  background: var(--primary);
  border-color: var(--primary);
}
.custom-checkbox.checked::after {
  content: '✓';
  color: white;
  font-size: 11px;
  font-weight: 700;
}
.forgot-link {
  font-size: 13px;
  color: var(--primary);
  font-weight: 600;
  transition: color .2s;
}
.forgot-link:hover { color: var(--primary-hover); }

/* 登录按钮 */
.login-btn {
  width: 100%;
  height: 48px;
  border-radius: var(--radius-sm);
  background: var(--primary);
  color: white;
  font-size: 15px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all .2s;
  font-family: var(--font-sans);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.login-btn:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
  box-shadow: var(--shadow-lg);
}
[data-theme="scifi"] .login-btn {
  box-shadow: 0 0 20px rgba(0,212,255,0.3);
}
[data-theme="scifi"] .login-btn:hover {
  box-shadow: 0 0 32px rgba(0,212,255,0.5);
}
.login-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left .5s;
}
.login-btn:hover::before { left: 100%; }

/* 分隔线 */
.divider {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.divider-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.divider-text {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
}

/* 社交登录 */
.social-login {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
.social-btn {
  height: 44px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-sans);
  gap: 8px;
}
.social-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-lighter);
}
[data-theme="scifi"] .social-btn {
  backdrop-filter: blur(12px);
}
[data-theme="scifi"] .social-btn:hover {
  box-shadow: 0 0 12px rgba(0,212,255,0.1);
}

/* 注册链接 */
.signup-link {
  text-align: center;
  font-size: 14px;
  color: var(--text-dim);
}
.signup-link a {
  color: var(--primary);
  font-weight: 600;
  transition: color .2s;
}
.signup-link a:hover { color: var(--primary-hover); }

/* 返回门户 */
.back-portal {
  position: fixed;
  top: 24px; right: 24px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  text-decoration: none;
}
[data-theme="scifi"] .back-portal {
  backdrop-filter: blur(12px);
}
.back-portal:hover {
  color: var(--primary);
  border-color: var(--primary);
}

/* 装饰性浮动元素 */
.float-decoration {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
}
.float-1 {
  width: 12px; height: 12px;
  background: var(--primary);
  opacity: 0.1;
  top: 20%; right: 10%;
  animation: float 6s ease-in-out infinite;
}
.float-2 {
  width: 8px; height: 8px;
  background: var(--accent);
  opacity: 0.15;
  bottom: 30%; right: 15%;
  animation: float 4s ease-in-out infinite 1s;
}
.float-3 {
  width: 16px; height: 16px;
  background: var(--primary);
  opacity: 0.08;
  top: 60%; right: 8%;
  animation: float 5s ease-in-out infinite 0.5s;
}
[data-theme="scifi"] .float-1,
[data-theme="scifi"] .float-2,
[data-theme="scifi"] .float-3 {
  box-shadow: 0 0 12px currentColor;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

/* 入场动画 */
.form-container > * {
  animation: slideUp .5s ease both;
}
.form-container > *:nth-child(1) { animation-delay: 0s; }
.form-container > *:nth-child(2) { animation-delay: .1s; }
.form-container > *:nth-child(3) { animation-delay: .15s; }
.form-container > *:nth-child(4) { animation-delay: .2s; }
.form-container > *:nth-child(5) { animation-delay: .25s; }
.form-container > *:nth-child(6) { animation-delay: .3s; }
.form-container > *:nth-child(7) { animation-delay: .35s; }
.form-container > *:nth-child(8) { animation-delay: .4s; }
.form-container > *:nth-child(9) { animation-delay: .45s; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 响应式 */
@media (max-width: 900px) {
  body { flex-direction: column; overflow-y: auto; }
  .brand-side {
    width: 100%;
    min-height: 280px;
    padding: 32px;
  }
  .brand-content h1 { font-size: 28px; }
  .brand-content p { font-size: 14px; margin-bottom: 20px; }
  .brand-stats { margin-top: 20px; }
  .form-side { width: 100%; padding: 32px; }
  .float-decoration { display: none; }
}
@media (max-width: 480px) {
  .brand-side { min-height: 200px; }
  .brand-content h1 { font-size: 22px; }
  .brand-features { display: none; }
  .form-title { font-size: 22px; }
  .social-login { grid-template-columns: 1fr; }
}
</style>
</head>
<body data-theme="light-blue">

<!-- 返回门户 -->
<a href="index.html" class="back-portal">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  返回门户
</a>

<!-- 品牌侧 -->
<div class="brand-side">
  <div class="brand-side-grid"></div>

  <div class="brand-header">
    <div class="brand-logo" id="brand-logo-icon">D</div>
    <div class="brand-name" id="brand-logo-name">DataNode</div>
  </div>

<script>
// 获取URL参数
function getUrlParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

// 主题配置
const themeConfig = {
  'light-blue': {
    logo: 'D', brand: 'DataNode',
    title: '数据驱动的<br>智能管理平台',
    desc: '为现代企业打造的全方位后台管理系统，集成数据分析、用户管理、订单处理等核心功能，助力业务高效运转。'
  },
  'white': {
    logo: 'P', brand: 'Purity',
    title: '极简设计<br>纯粹体验',
    desc: '去除多余装饰，聚焦核心功能。以最简洁的设计语言，提供最高效的管理体验，让每一次操作都精准到位。'
  },
  'scifi': {
    logo: 'N', brand: 'Nexus',
    title: '未来科技<br>连接一切',
    desc: '融合前沿科技与未来美学，打造沉浸式管理体验。霓虹辉光与毛玻璃质感，重新定义企业级后台的视觉标准。'
  }
};

// 初始化主题
let currentTheme = getUrlParam('theme') || 'light-blue';
document.body.setAttribute('data-theme', currentTheme);
updateBrand();

function updateBrand() {
  const config = themeConfig[currentTheme];
  document.getElementById('brand-logo-icon').textContent = config.logo;
  document.getElementById('brand-logo-name').textContent = config.brand;
  document.getElementById('brand-title').innerHTML = config.title;
  document.getElementById('brand-desc').textContent = config.desc;
}

// 主题切换
document.querySelectorAll('[data-theme-btn]').forEach(btn => {
  if (btn.dataset.themeBtn === currentTheme) {
    btn.classList.add('active');
  }
  btn.addEventListener('click', () => {
    currentTheme = btn.dataset.themeBtn;
    document.body.setAttribute('data-theme', currentTheme);
    document.querySelectorAll('[data-theme-btn]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateBrand();
    const url = new URL(window.location);
    url.searchParams.set('theme', currentTheme);
    window.history.replaceState({}, '', url);
  });
});

// 密码可见切换
function togglePassword() {
  const field = document.getElementById('password-field');
  const icon = document.getElementById('eye-icon');
  if (field.type === 'password') {
    field.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    field.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

// 记住我切换
function toggleCheckbox(e) {
  e.preventDefault();
  document.getElementById('remember-checkbox').classList.toggle('checked');
}

// 登录处理
function handleLogin(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.login-btn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> 登录中...';
  btn.style.pointerEvents = 'none';

  setTimeout(() => {
    window.location.href = 'dashboard.html?theme=' + currentTheme;
  }, 1200);
}

// 添加旋转动画
const style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);
</script>
